<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifica — {{ row.Azienda }}</title>
<link rel="icon" href="/static/logo_icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <img class="brand-icon" src="/static/logo_icon.png" alt="Schoenbech">
    <img class="brand-full" src="/static/logo_full.png" alt="Schoenbech · Talent Sourcing Advisory">
  </a>
  <nav class="nav">
    <a href="/">Bozze</a>
    <a href="/invio">Invio</a>
  </nav>
</header>

<div class="wrap" style="max-width:1000px">
  <div class="card">
    <h3>Modifica contatto · {{ row.Azienda }}</h3>
    <form class="grid" method="post" action="/edit/{{ i }}">
      <div><label>Azienda *</label><input name="azienda" value="{{ row.Azienda }}" required></div>
      <div><label>Nome e Cognome contatto *</label><input name="contatto" value="{{ row.Contatto }}" required></div>
      <div><label>Titolo</label>
        <select name="titolo">
          <option value="">auto</option>
          <option {% if row._titolo == 'Dott.' %}selected{% endif %}>Dott.</option>
          <option {% if row._titolo == 'Dott.ssa' %}selected{% endif %}>Dott.ssa</option>
        </select>
      </div>
      <div><label>Email *</label><input name="email" type="email" value="{{ row.Email }}" required></div>
      <div><label>Timing</label><input name="timing" value="{{ row.Timing }}"></div>
      <div><label>Flag</label>
        <select name="flag">
          {% for f in ['OK','Correzione','Verifica','Sensibile'] %}
          <option {% if row.Flag == f %}selected{% endif %}>{{ f }}</option>
          {% endfor %}
        </select>
      </div>
      <div><label>Tipo gancio</label>
        <select name="tipo_gancio">
          {% for t in ['Scarsità','Visibilità','Fase','Neutro'] %}
          <option {% if row.Tipo_gancio == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div><label>Fonte 1</label><input name="fonte1" value="{{ row.Fonte1 }}"></div>
      <div><label>Fonte 2</label><input name="fonte2" value="{{ row.Fonte2 }}"></div>
      <div class="full"><label>Contesto (dopo "al mondo ...") *</label>
        <textarea name="contesto" required>{{ row.Contesto }}</textarea></div>
      <div class="full"><label>Gancio — 1 frase, tono consulenziale (dopo i due punti)</label>
        <textarea name="gancio">{{ row.Gancio }}</textarea></div>
      <div class="full hint">Regole: soggetto "noi/il mercato", un solo riferimento, niente numeri / acquisizioni / investimenti.</div>
      <div class="full row">
        <button class="btn" type="submit">Salva modifiche</button>
        <a class="link-gold" href="/">Annulla</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
